[project]
name = "big-brother"
version = "0.1.0"
description = "Claude Code writes the tests, a local Ollama model writes the code, and neither may touch the other's files."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["big_brother"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need the real local model are opt-in: uv run pytest -m ollama
addopts = ["-m", "not ollama"]
markers = ["ollama: needs the local Ollama server and the builder model (starts it on demand)"]
